# One project, whatever the folder is called: containers robofriend-*, volume robofriend_pgdata.
name: robofriend

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: robofriend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: botdb
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpass
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d botdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-migrate:
    image: postgres:16-alpine
    container_name: robofriend-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: botdb
      APP_DB_USER: botuser
      APP_DB_PASSWORD: botpass
      LEGACY_DB_SUPERUSER: postgres
      LEGACY_DB_PASSWORD: password
    volumes:
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"

  backend:
    build: ./bot-back
    container_name: robofriend-backend
    restart: unless-stopped
    env_file:
      - .env
    # The backend owns the schema (Flyway). It doesn't wait for the embedding service: facts saved
    # while that is still loading its model get their vectors in the background.
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      ai-memory-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/botdb
      SPRING_DATASOURCE_USERNAME: botuser
      SPRING_DATASOURCE_PASSWORD: botpass
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_MODEL: ${GROQ_API_MODEL:-openai/gpt-oss-120b}
      MEMORY_SERVICE_URL: http://ai-memory-service:8000
      MEMORY_SERVICE_TOKEN: ${MEMORY_SERVICE_TOKEN:-local-dev-token}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  frontend:
    build: ./bot-front
    container_name: robofriend-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

  ai-memory-service:
    build: ./ai-memory-service
    container_name: robofriend-ai-memory
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    # Stateless: it only turns text into vectors and never touches the database.
    environment:
      MEMORY_SERVICE_TOKEN: ${MEMORY_SERVICE_TOKEN:-local-dev-token}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  pgdata:
