name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build backend
        working-directory: bot-back
        run: chmod +x mvnw && ./mvnw test

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bot-front/package-lock.json
      - name: Build frontend
        working-directory: bot-front
        run: npm ci && npm run lint && npm test && npm run build

  # Browser tests of the main flows; the API is faked in the browser, so no backend is needed.
  # The official Playwright image already has the browsers and their system libraries, so nothing is
  # installed with apt (which fails whenever the Ubuntu mirrors are unreachable).
  # Keep the image tag equal to the @playwright/test version in bot-front/package.json.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - name: Browser tests (Playwright)
        working-directory: bot-front
        run: npm ci && npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: bot-front/playwright-report
          retention-days: 7
