name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build backend
        working-directory: bot-back
        run: chmod +x mvnw && ./mvnw test

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bot-front/package-lock.json
      - name: Build frontend
        working-directory: bot-front
        run: npm ci && npm run lint && npm run build

      # Browser tests of the main flows; the API is faked in the browser, so no backend is needed.
      - name: Browser tests (Playwright)
        working-directory: bot-front
        run: npx playwright install --with-deps chromium && npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: bot-front/playwright-report
          retention-days: 7
