server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Fail fast when the database is unreachable (default is 30s), so health reports DOWN promptly.
spring.datasource.hikari.connection-timeout=5000

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Databases created before Flyway already have the V1 schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
# Don't hold a database connection for the whole web request (streamed replies take seconds).
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

groq.api.key=${GROQ_API_KEY:}
groq.api.model=${GROQ_API_MODEL:openai/gpt-oss-120b}

memory.service.url=${MEMORY_SERVICE_URL:http://localhost:8000}
memory.service.token=${MEMORY_SERVICE_TOKEN:local-dev-token}

# Front-ends allowed to call the API from another origin (comma-separated).
# The Docker setup is same-origin through nginx; these cover local development.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081}

# Actuator: only the health endpoint (database + disk), without details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
